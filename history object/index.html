
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser History Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Browser History Navigator</h1>

        <p id="history">History Length: </p>

        <div class="buttons">
            <button id="back-btn">Back</button>
            <button id="for-btn">Forward</button>
            <button id="go-btn">Go Back 2 Pages</button>
            <button id="reload-btn">Reload</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
