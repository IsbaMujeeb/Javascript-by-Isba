
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Info Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Browser Info Checker</h1>
        <p class="subtitle">Discover information about your browser</p>

        <div class="info-card">
            <h3>Browser Information</h3>
            <div id="browser">Not checked yet</div>
        </div>

        <div class="info-card">
            <h3>Internet Status</h3>
            <div id="status">Not checked yet</div>
        </div>

        <div class="info-card">
            <h3>Browser Language</h3>
            <div id="language">Not checked yet</div>
        </div>
        <div class="info-card">
    <h3>Cookies Status</h3>
    <div id="cookies">Not checked yet</div>
</div>

        <button id="checkBtn">Check Information</button>

    </div>

    <script src="app.js"></script>
</body>
</html>
