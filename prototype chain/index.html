
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Management System</h1>
        <p class="subtitle">Manage student information</p>

        <div class="form">

            <input type="text" id="nameInput" placeholder="Enter student name">

            <input type="number" id="ageInput" placeholder="Enter age">

            <input type="text" id="courseInput" placeholder="Enter course">

            <button id="createBtn">Create Student</button>

        </div>

        <div id="output" class="output">
            <p>Student information will appear here.</p>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
