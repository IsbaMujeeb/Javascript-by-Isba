
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Price Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="calculator">
        <h1>Smart Price Calculator</h1>
        <p>Learning JavaScript Arrow Functions</p>

        <label for="price">Product Price (Rs.)</label>
        <input type="number" id="price" placeholder="Enter price">

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" placeholder="Enter quantity">

        <button id="calculateBtn">Calculate Total</button>

        <h2 id="result">Total: Rs. 0</h2>
    </div>

</body>
</html>
