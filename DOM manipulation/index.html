
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Live Text Preview</h1>

        <input type="text" id="message" placeholder="Type something...">

        <div class="preview">
            <h3>Your Preview:</h3>
            <p id="display">Your text will appear here...</p>
        </div>
    </div>
<button id="clearBtn">Clear Text</button>
    <script src="app.js"></script>
</body>
</html>
