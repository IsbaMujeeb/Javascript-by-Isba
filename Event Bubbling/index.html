
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My Shopping List</h1>
        <p class="subtitle">Click an item to remove it from your list.</p>

        <div class="shopping-list" id="shoppingList">
            <button class="item">🥛 Milk <span>✕</span></button>
            <button class="item">🍞 Bread <span>✕</span></button>
            <button class="item">🥚 Eggs <span>✕</span></button>
            <button class="item">🍎 Apples <span>✕</span></button>
        </div>

        <p class="hint">Your daily shopping, made simple.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
