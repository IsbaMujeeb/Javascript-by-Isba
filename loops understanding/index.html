
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favourite TV Shows</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>My Favourite TV Shows</h1>
        <p>Learning JavaScript Loops</p>
    </header>

    <main>
        <section>
            <h2>For Loop</h2>
            <ul id="for-loop"></ul>
        </section>

        <section>
            <h2>While Loop</h2>
            <ul id="while-loop"></ul>
        </section>

        <section>
            <h2>Do-While Loop</h2>
            <ul id="do-while-loop"></ul>
        </section>

        <section>
            <h2>For...of Loop</h2>
            <ul id="for-of-loop"></ul>
        </section>

        <section>
            <h2>For...in Loop</h2>
            <ul id="for-in-loop"></ul>
        </section>
    </main>

    <footer>
        <p>Built to understand JavaScript loops.</p>
    </footer>

</body>
</html>
