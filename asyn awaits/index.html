<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="joke-card">

            <div class="emoji">😂</div>

            <h1>Random Joke Generator</h1>

            <p class="subtitle">Need a little laugh? Let's find one!</p>

            <div class="joke-box">

                <p id="loading"></p>

                <p id="joke">
                    Your next laugh is just one click away!
                </p>

                <p id="error"></p>

            </div>

            <button id="jokeBtn">Get a Joke</button>

            <p class="footer">Made with JavaScript ❤️</p>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
