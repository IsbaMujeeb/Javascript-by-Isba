<!DOCTYPE html>
<html>
<head>
    <title>URL Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>URL Explorer</h1>

        <div id="url"></div>
        <div id="hostname"></div>
        <div id="protocol"></div>
        <div id="pathname"></div>
        <div id="search"></div>
        <div id="hash"></div>

        <button id="reloadBtn">Reload Page</button>
        <button id="googleBtn">Go to Google</button>
        <button id="replaceBtn">Replace Page</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
